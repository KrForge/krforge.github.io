<head>
    <title>
        KrForge - Projects
    </title>
    <link rel="icon" type="image/x-icon" href="CSS/Resources/Logos/KrForge.png">
    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/variables.css">
    <link rel="stylesheet" href="CSS/banner.css">
    <link rel="stylesheet" href="CSS/banner_ani.css">
    <link rel="stylesheet" href="CSS/subpage.css">
</head>
<body>
    <div id="Topbar"></div>
    <div class="Content">
        <div class="Banner">
            <div class="BannerAnimation" data-icons="software" style="position: absolute; overflow: hidden;">
                <div class="AnimationRow"></div>
                <div class="AnimationRow"></div>
            </div>
            <div class="Branding">
                <img src="CSS/Resources/Icons/Projects.png">
                <div class="BrandingText">
                    <h1>Projects</h1>
                    <p>Software without the Spyware</p>
                </div>
            </div>
        </div>
        <div class="Panel" id="ContentDivider">
            <img src="CSS/Resources/Aero/CornerGlow.png" class="PanelCornerGlow">
        </div>
        <div class="HomeColumns">
            <div class="LeftColumn">
                <div class="Panel" id="NewsPane">
                    <img src="CSS/Resources/Aero/CornerGlow.png" class="PanelCornerGlow" style="opacity: 15%;">
                    <img src="CSS/Resources/Aero/Glass.png" class="PanelCornerGlow" style="opacity: 10%;">
                    <div class="NewsContent">
                        <h1 class="PanelHeader">
                            Updates
                        </h1>
                        <li>Released ReBriefcase</li>
                        <li>ReBriefcase stopped being maintained</li>
                    </div>
                </div>
            </div>
            <div class="RightColumn" id="CardContainer" data-card-type="software">
            </div>
        </div>
    </div>

    <script src="JS/page_init.js"></script>
    <script src="JS/banner_ani.js"></script>
    <script src="JS/load_cards.js"></script>
</body>
